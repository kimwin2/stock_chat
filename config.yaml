# 대상 채널 요약 — 설정
# 비밀값은 여기 넣지 말 것. .env 로.

telegram:
  # 운영자가 6개월마다 채널을 새로 엶. 새 채널이 생기면 맨 아래에 추가만 하면 됨.
  # 과거 채널은 지우지 말 것 — 이미 수집한 데이터의 출처 표기에 쓰임.
  channels:
    - id: ch_2026h1
      label: "주식 채널 (26년 상반기)"
      link: "CLOSED"          # 2026-06-26 종료. 신규 수집 대상 아님.
      active: false
    - id: ch_2026h2
      # 실제 채널 제목 기준. 12월 말에 다음 채널이 열리면 항목을 새로 추가할 것.
      label: "주식 채널 (26년 12월 말까지)"
      link: "https://t.me/+MtTuLUtO8a8wYzhl"   # 2026-08-11 갱신 (이전 두 링크 만료)
      active: true

vision:
  # 사진을 Gemini 비전으로 판독해 요약·검색에 넣을지.
  # 2026-08-04 부터 켬 — 신규분만 보면 하루 약 35회 호출이라 무료 쿼터로 감당된다
  # (앨범·12분 창으로 최대 6장씩 묶어 보내므로 사진 수보다 호출 수가 훨씬 적다).
  enabled: true
  # 이 날짜 이후 사진만 판독한다. 쌓여 있던 과거분 백필로 쿼터가 터지는 것을 막는다.
  # 과거분도 판독하고 싶으면 날짜를 당기면 된다 — 이어달리기라 며칠에 나눠 소화된다.
  start_date: "2026-08-04"

crawl:
  default_weeks: 1            # CLI·자정 daily.yml 기본값 (UI 갱신 버튼은 항상 당일 증분)
  allowed_weeks: [1, 2, 3, 4] # CLI·workflow_dispatch 허용 범위
  max_messages: 4000          # 안전 상한 (4주 × 약 200/일 = 5600 이지만 실제론 훨씬 적음)
  download_media: true
  media_max_width: 800        # webp 리사이즈 폭
  media_retention_days: 28    # 이보다 오래된 원본 이미지는 삭제 (텍스트 추출본은 영구 보관)
  # 요약이 근거로 인용한 이미지를 최근 N일치만 웹 번들에 실어 보낸다 (썸네일 480px).
  # 0 으로 두면 이미지를 아예 배포하지 않는다 — 레포 용량이 걱정되면 0.
  image_pack_days: 7

models:
  # 2026-08 기준 이 API 키로 실제 호출해 무료 등급 쿼터까지 확인한 값들.
  #   gemini-2.5-flash  → 신규 사용자에게 404. 사용 불가
  #   gemini-3.6-flash  → 하루 20회. 판독 정확도는 가장 좋지만 파이프라인엔 못 씀
  #   gemini-3.5-flash  → 쿼터 여유 있음. 요약·답변에 사용
  #   *-flash-lite      → 쿼터 가장 넉넉. 분류에 사용
  #   gemini-2.0-flash  → 분당 한도에 바로 걸림. 사용 안 함
  # 쿼터가 가장 넉넉한 flash-lite 로 통일. 매일 도는 파이프라인이라
  # 품질보다 "매일 빠짐없이 도는 것"이 우선이다.
  vision: "gemini-3.5-flash-lite"     # vision.enabled 를 켤 때만 쓰임
  classify: "gemini-3.5-flash-lite"
  summarize: "gemini-3.5-flash-lite"
  # embedding-001 은 무료 1,000회/일. 하루치를 처음 인덱싱하면 바로 소진된다.
  # embedding-2 는 쿼터 버킷이 별도라 훨씬 여유롭다 (실측 확인).
  # 모델을 바꾸면 벡터 공간이 달라지므로 인덱스가 자동으로 재계산된다.
  embed: "gemini-embedding-2"
  answer: "gemini-3.5-flash-lite"     # 브라우저에서 Q&A 답변 생성에 사용
  embed_dim: 256                   # 번들 크기를 위해 축소 (int8 양자화까지 적용)
  classify_batch: 60

rag:
  index_days: 120             # RAG 인덱스에 포함할 최근 일수
  chunk_max_chars: 900
  top_k: 24                   # 검색 후 LLM 에 넘길 청크 수

summary:
  # 요약을 만들 때 하루를 두 개의 시장으로 나누는 기준 (KST)
  # 국장: 06:00~20:00 / 미장: 20:00~06:00 (익일) — 다만 실제 분류는 LLM 이 내용 기준으로 판단
  archive_days: 400           # 요약 보관 일수
